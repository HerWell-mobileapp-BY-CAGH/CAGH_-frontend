name: cagh_frontend
description: "CAGH Midwife Connect - Frontend Flutter Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.3.1
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^8.1.2
  http: ^1.2.0
  shared_preferences: ^2.2.2
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.0
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  flutter_dotenv: ^5.1.0
  table_calendar: ^3.2.1
  url_launcher: ^6.3.2
  agora_rtc_engine: ^6.3.2
  flutter_callkit_incoming: ^3.1.5
  web_socket_channel: ^3.0.3
  audioplayers: ^6.1.1
  http_parser: ^4.1.2
  mime: ^2.0.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.23

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  background_color: "#FFFFFF"
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"