name: cagh_frontend
description: "CAGH Midwife Connect - Frontend Flutter Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^8.1.2
  http: ^1.2.0
  shared_preferences: ^2.2.2
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.0
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env